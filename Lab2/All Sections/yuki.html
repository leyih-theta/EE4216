<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>九婴白骨爪</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
        <script src="script.js" async defer></script>
    </head>
    <body>
        <!--[if lt IE 7]>
            <p class="browsehappy">You are using an <strong>outdated</strong> browser. Please <a href="#">upgrade your browser</a> to improve your experience.</p>
        <![endif]-->
        <div class="container">

            <h1>LED Control Panel</h1>
            
            <div class="control">
                <label for="distance">Distance (cm)</label>
                <input type="number" id="distance"
                   min="0" step="0.1" value="30">
            </div>

            <div class="control">
                <label for="color">LED Color</label>
                <input type="color" id="color" value="#00ff00">
            </div>

            <div class="control">
                <label for="brightness">
                Brightness: <span id="brightnessValue">50</span>%
                </label>
                <input type="range" id="brightness"
                    min="0" max="100" value="50">
            </div>

        </div>

    </body>
</html>
